# 台股每日更新（GitHub Actions，公開儲存庫免費）
# 2026-11-05 起全部用政府開放資料（證交所、櫃買 OpenAPI）。證交所的開放資料比較晚更新（晚上還是前一天的），
# 所以一天跑三次：台灣 17:30、21:30、隔天 08:00。每次都把抓到的資料存進 store/tw/（累積歷史），
# 上市和上櫃同一天的資料都到齊後才產生那天的報告；已經做好的 AI 解說不會重做。
name: 每日更新資料
on:
  schedule:
    - cron: '30 9 * * 1-5'    # 台灣 17:30
    - cron: '30 13 * * 1-5'   # 台灣 21:30
    - cron: '0 0 * * 2-6'     # 台灣隔天 08:00（週二～週六）
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: { group: tw-data, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: 抓開放資料、產生解說和報告
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: node pipeline/build.js
      - name: 存回儲存庫（GitHub Pages 會自動更新網站）
        run: |
          git config user.name "daily-bot"
          git config user.email "daily-bot@users.noreply.github.com"
          git add data store
          git diff --cached --quiet || (git commit -m "資料更新 $(date -u +%F)" && git pull --rebase && git push)
      - name: 同步到 Cloudflare Pages（有設定 CLOUDFLARE_API_TOKEN 才會跑）
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: c09dbc37ae13754d8cdb53f01444bcf1
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "沒有 CLOUDFLARE_API_TOKEN，跳過"; exit 0; fi
          node scripts/site.js && npx --yes wrangler@4 pages deploy site --project-name gushi --branch main --commit-dirty=true

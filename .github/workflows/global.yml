# 美股、陸股：【已暫停】資料授權沒有確認，不能公開提供（2026-11-05）
#   美股 Massive 免費方案：只限個人、非商業使用，不能提供給第三人（Individuals Terms §2、§6.1(f)(ix)、§7）
#   陸股 BaoStock：沒有公開的資料使用條款，原始資料權利屬上交所／深交所，商業轉發通常要授權
# 程式保留，只能在本機個人使用：更新資料.cmd 或 node pipeline/cn.js、node pipeline/us.js
# 之後取得書面授權（或找到明確允許免費商業使用的來源）再恢復排程和 data/us、data/cn
name: 美股陸股（已暫停）
on:
  workflow_dispatch: {}
jobs:
  paused:
    runs-on: ubuntu-latest
    steps:
      - run: echo "美股、陸股資料授權未確認，已暫停公開更新。說明在 README.md。"
